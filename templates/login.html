{% extends 'base.html' %}
{% block title %}Login — RUMAH KARIR{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card">
    <h1>Login</h1>
    <p class="muted" style="margin-top:-12px;">Masuk untuk membuka semua fitur RUMAH KARIR.</p>
    <form id="login-form">
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Masukkan email Anda" required />
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />
      </div>
      <div id="login-msg"></div>
      <button class="btn" type="submit" style="width:100%;">Masuk</button>
    </form>
    <p class="muted" style="text-align:center; margin-top:14px;">
      Belum punya akun? <a href="/register">Daftar di sini</a>
    </p>
    <p class="muted" style="text-align:center; margin-top:4px; font-size:12px;">
      Admin: gunakan email <code>admin@admin.com</code>
    </p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('login-msg');
  msg.innerHTML = '';
  const body = {
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  };
  const { ok, data } = await window.api('/api/auth/login', { method: 'POST', body });
  if (!ok || !data || !data.ok) {
    msg.innerHTML = `<div class="alert error">${window.escapeHtml((data && data.error) || 'Login gagal')}</div>`;
    return;
  }
  window.location.href = data.redirect || '/';
});
</script>
{% endblock %}
